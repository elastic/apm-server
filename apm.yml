name: apm-server
version: 1.0.0

# Agent Package Manager (https://microsoft.github.io/apm/)
# Declares agent skills for this repository.
#
# Skills live in .skills/ and follow the open Agent Skills spec (agentskills.io).
#
# LOCAL USAGE — deploy to your AI tool:
#   apm install
#
# GH AW USAGE — the GitHub Agentic Workflow at .github/workflows/updatecli-failure-report.md
#   loads skills via `imports: microsoft/apm/.github/workflows/shared/apm.md`.
#   Packages are installed at runtime from the default branch, so skill changes
#   only take effect in the workflow once merged.

dependencies:
  apm:
    - path: .skills/debug-updatecli
