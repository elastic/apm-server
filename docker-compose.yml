#
# This configuration is used for systemtests
# For manual testing, you should probably prefer using Tilt.
# See https://github.com/elastic/apm-server/blob/main/dev_docs/TESTING.md#tilt--kubernetes
#
# Host bind address and ports, heap size, log level and credentials come from .env:
#   cp .env.example .env
# Every variable is required; docker compose fails if one is unset.
#
version: '3.9'
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "1g"
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:9.7.0-4b4a17d3-SNAPSHOT
    ports:
      - "${STACK_BIND_IP:?set STACK_BIND_IP in .env (see .env.example)}:${ES_PORT:?set ES_PORT in .env (see .env.example)}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=500ms"]
      retries: 300
      interval: 1s
    environment:
      - "ES_JAVA_OPTS=-Xms${ES_HEAP:?set ES_HEAP in .env (see .env.example)} -Xmx${ES_HEAP:?set ES_HEAP in .env (see .env.example)}"
      - "network.host=0.0.0.0"
      - "transport.host=127.0.0.1"
      - "http.host=0.0.0.0"
      - "cluster.routing.allocation.disk.threshold_enabled=false"
      - "discovery.type=single-node"
      - "xpack.security.authc.anonymous.roles=remote_monitoring_collector"
      - "xpack.security.authc.realms.file.file1.order=0"
      - "xpack.security.authc.realms.native.native1.order=1"
      - "xpack.security.enabled=true"
      - "xpack.license.self_generated.type=trial"
      - "xpack.security.authc.token.enabled=true"
      - "xpack.security.authc.api_key.enabled=true"
      - "logger.org.elasticsearch=${ES_LOG_LEVEL:?set ES_LOG_LEVEL in .env (see .env.example)}"
      - "action.destructive_requires_name=false"
    volumes:
      - "./testing/docker/elasticsearch/roles.yml:/usr/share/elasticsearch/config/roles.yml"
      - "./testing/docker/elasticsearch/users:/usr/share/elasticsearch/config/users"
      - "./testing/docker/elasticsearch/users_roles:/usr/share/elasticsearch/config/users_roles"
    logging: *default-logging

  kibana:
    image: docker.elastic.co/kibana/kibana-wolfi:9.7.0-4b4a17d3-SNAPSHOT
    ports:
      - "${STACK_BIND_IP:?set STACK_BIND_IP in .env (see .env.example)}:${KIBANA_PORT:?set KIBANA_PORT in .env (see .env.example)}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q 'All services are available'"]
      retries: 300
      interval: 1s
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: "${KIBANA_ES_USER:?set KIBANA_ES_USER in .env (see .env.example)}"
      ELASTICSEARCH_PASSWORD: "${KIBANA_ES_PASS:?set KIBANA_ES_PASS in .env (see .env.example)}"
      XPACK_FLEET_AGENTS_ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    depends_on:
      elasticsearch: { condition: service_healthy }
    volumes:
      - "./testing/docker/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml"
    logging: *default-logging

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:9.7.0-4b4a17d3-SNAPSHOT
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: "${METRICBEAT_ES_USER:?set METRICBEAT_ES_USER in .env (see .env.example)}"
      ELASTICSEARCH_PASSWORD: "${METRICBEAT_ES_PASS:?set METRICBEAT_ES_PASS in .env (see .env.example)}"
    depends_on:
      elasticsearch: { condition: service_healthy }
    volumes:
      - "./testing/docker/metricbeat/elasticsearch-xpack.yml://usr/share/metricbeat/modules.d/elasticsearch-xpack.yml"
      - "./testing/docker/metricbeat/apm-server.yml://usr/share/metricbeat/modules.d/apm-server.yml"
    profiles:
      - monitoring
    logging: *default-logging
